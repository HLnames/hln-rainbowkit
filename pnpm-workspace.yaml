preferWorkspacePackages: true
packages:
  - 'packages/*'
  - 'packages/create-rainbowkit/**/*-app'
  - 'site'
  - 'examples/*'
# Don't install packages < 3 days old
minimumReleaseAge: 4320

allowBuilds:
  esbuild: true
  msw: false
  bufferutil: false
  utf-8-validate: false
  keccak: false
  secp256k1: false
  sharp: false
  protobufjs: false
  "@reown/appkit": false
  unrs-resolver: false
